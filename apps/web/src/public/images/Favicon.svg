<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="135%" y2="135%">
      <stop offset="0%" style="stop-color:#1246C8"/>
      <stop offset="100%" style="stop-color:#091A50"/>
    </linearGradient>

    <linearGradient id="arcL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4D8EFF;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#4D8EFF;stop-opacity:0.9"/>
    </linearGradient>

    <linearGradient id="arcR" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#4D8EFF;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#4D8EFF;stop-opacity:0.9"/>
    </linearGradient>

    <filter id="nodeGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="iconShadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#091A50" flood-opacity="0.28"/>
    </filter>

    <clipPath id="iconClip">
      <rect x="0" y="0" width="160" height="160" rx="38"/>
    </clipPath>
  </defs>

  <g transform="translate(20, 20)" filter="url(#iconShadow)">
    <rect x="0" y="0" width="160" height="160" rx="38" fill="url(#iconBg)"/>

    <rect x="0" y="0" width="160" height="160" rx="38" fill="none"
          stroke="white" stroke-width="1" opacity="0.06"/>

    <circle cx="42" cy="52" r="18" fill="white"/>
    <path d="M 10 100 Q 10 74 42 74 Q 74 74 74 100" fill="white"/>

    <rect x="90" y="58" width="58" height="58" rx="5" fill="white"/>
    <rect x="98" y="66" width="12" height="10" rx="2" fill="url(#iconBg)"/>
    <rect x="116" y="66" width="12" height="10" rx="2" fill="url(#iconBg)"/>
    <rect x="134" y="66" width="6" height="10" rx="2" fill="url(#iconBg)"/>
    <rect x="98" y="82" width="12" height="10" rx="2" fill="url(#iconBg)"/>
    <rect x="116" y="82" width="12" height="10" rx="2" fill="url(#iconBg)"/>
    <rect x="134" y="82" width="6" height="10" rx="2" fill="url(#iconBg)"/>
    <rect x="109" y="96" width="14" height="20" rx="3" fill="#FF6B2B"/>

    <path d="M 74 56 Q 96 46 106 80" fill="none"
          stroke="url(#arcL)" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 74 74 Q 90 72 106 80" fill="none"
          stroke="url(#arcL)" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 62 92 Q 82 96 106 80" fill="none"
          stroke="url(#arcL)" stroke-width="1.4" stroke-linecap="round"/>

   
  </g>

 
</svg>