<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" role="img">
<title>Logo Job Matcher - nền tối</title>
<desc>Chú ong hình học kiểu mạch điện tử cầm kính lúp tìm việc, kèm chữ Job Matcher</desc>
<style>
.node{animation:pulse 1.8s ease-in-out infinite}
.n1{animation-delay:.0s}.n2{animation-delay:.25s}.n3{animation-delay:.5s}
.n4{animation-delay:.75s}.n5{animation-delay:1.0s}.n6{animation-delay:1.25s}
@keyframes pulse{0%,100%{opacity:.35;r:3}50%{opacity:1;r:5}}
.wing{transform-box:fill-box;transform-origin:center;animation:flutter 2.4s ease-in-out infinite}
.wingR{animation-delay:.15s}
@keyframes flutter{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-6deg)}}
.scanline{transform-box:fill-box;transform-origin:center;animation:scanMove 1.4s ease-in-out infinite alternate}
@keyframes scanMove{0%{transform:translateY(-16px)}100%{transform:translateY(16px)}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s ease-out infinite}
.ping2{animation-delay:1.1s}
@keyframes ping{0%{r:26;opacity:.6}100%{r:44;opacity:0}}
</style>
<defs><clipPath id="lensClipDarkExport"><circle cx="178" cy="172" r="23"/></clipPath></defs>
<polygon points="110,52 160,81 160,139 110,168 60,139 60,81" fill="#6366f1" fill-opacity="0.12" stroke="#6366f1" stroke-width="4"/>
<polygon points="110,72 143,91 143,129 110,148 77,129 77,91" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4"/>
<path class="wing" d="M85,60 L65,45 L78,68 Z" fill="none" stroke="#6366f1" stroke-width="2" stroke-linejoin="round"/>
<circle cx="65" cy="45" r="2.5" fill="#8b5cf6"/>
<path class="wing wingR" d="M135,60 L155,45 L142,68 Z" fill="none" stroke="#6366f1" stroke-width="2" stroke-linejoin="round"/>
<circle cx="155" cy="45" r="2.5" fill="#8b5cf6"/>
<line x1="90" y1="95" x2="130" y2="95" stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>
<line x1="85" y1="110" x2="135" y2="110" stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>
<line x1="92" y1="125" x2="128" y2="125" stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>
<circle class="node n1" cx="110" cy="52" r="4" fill="#8b5cf6"/>
<circle class="node n2" cx="160" cy="81" r="4" fill="#6366f1"/>
<circle class="node n3" cx="160" cy="139" r="4" fill="#6366f1"/>
<circle class="node n4" cx="110" cy="168" r="4" fill="#6366f1"/>
<circle class="node n5" cx="60" cy="139" r="4" fill="#6366f1"/>
<circle class="node n6" cx="60" cy="81" r="4" fill="#6366f1"/>
<circle class="ping ping1" cx="178" cy="172" r="26" fill="none" stroke="#6366f1" stroke-width="2"/>
<circle class="ping ping2" cx="178" cy="172" r="26" fill="none" stroke="#6366f1" stroke-width="2"/>
<line x1="196" y1="190" x2="216" y2="210" stroke="#6366f1" stroke-width="8" stroke-linecap="round"/>
<circle cx="178" cy="172" r="26" fill="#1e293b" stroke="#6366f1" stroke-width="5"/>
<g clip-path="url(#lensClipDarkExport)">
<rect x="166" y="164" width="24" height="15" rx="2" fill="#6366f1" fill-opacity="0.9"/>
<path d="M172,164 Q178,157 184,164" fill="none" stroke="#6366f1" stroke-width="2"/>
<rect x="175" y="169" width="6" height="5" rx="1" fill="#8b5cf6"/>
<line class="scanline" x1="155" y1="172" x2="201" y2="172" stroke="#8b5cf6" stroke-width="2" opacity="0.9"/>
</g>
<text x="210" y="122" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#f8fafc">Job Matcher</text>
<text x="210" y="152" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#94a3b8">AI matching, made simple</text>
</svg>
